<!doctype html>

<html>
  <head>
    <title>Flexbox</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        border: 1px solid black;
      }
      .box-1 {
        background: red;
        flex-grow: 1;
      }
      .box-2 {
        background: yellow;
        flex-shrink: 1;
      }
      .box-3 {
        background: green;
        flex-shrink: 1;
      }
      .box-4 {
        background: blue;
        flex-grow: 1;
      }
      .box-5 {
        background: purple;
        flex-shrink: 1;
      }
    </style>
  </head>
  <body style="max-width: 500px">
    <div
      style="display: flex; justify-content: center; flex-wrap: wrap; gap: 16px"
    >
      <div class="box box-1">1</div>
      <div class="box box-2">2</div>
      <div class="box box-3">3</div>
      <div class="box box-4">4</div>
      <div class="box box-5">5</div>
    </div>
  </body>
</html>
